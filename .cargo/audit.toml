    #   grep -n 'load_system_fonts' ~/.cargo/registry/src/*/cosmic-text-0.15.0/src/font/system.rs
    #   sed -n 112,136p ~/.cargo/registry/src/*/iced_graphics-0.14.0/src/text.rs
    #   cargo tree --locked --workspace -e normal,build,dev -i usvg --target aarch64-apple-darwin
    #   cargo tree --locked --workspace -e normal,build,features --target aarch64-apple-darwin -i iced_renderer | grep -c fira
    #   grep -n 'forbid(unsafe_code)' ~/.cargo/registry/src/*/ttf-parser-0.25.1/src/lib.rs
    # Expect: The tree shows ttf-parser reached only through fontdb and cosmic-text. The git
