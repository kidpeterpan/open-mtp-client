# Advisories this project knowingly accepts, and why.
#
# Only advisory ids are listed, never crate names: an id hides exactly that advisory, and
# every other advisory, including a new one against the same crate, is still reported.
#
# An entry is the block above its quoted id: a "# --- <ID> ---" line, then these keys in this
# order: Crate, Issue, Accepted, Review by, Platform scope, Reason, Evidence, Expect, Remove when.
# A value may continue on the next lines, which start with "#" and three spaces.
# internal/tests/audit_ledger.rs checks the layout.

