    # Review by: 2027-04-19
    # Platform scope: any
    # Reason: A procedural macro: it runs while the app is compiled and is not part of the
    #   running app. Reached through metal and wgpu-hal.
    # Evidence: Needs registry access; on a checkout that was never built, run this first:
