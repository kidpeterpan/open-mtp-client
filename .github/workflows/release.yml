name: Release

# Push a tag like v0.1.0 to publish a release with the dmg attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: make test

      - name: Build the dmg (Apple Silicon and Intel in one app)
        run: make dmg

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "open-mtp-client-${VERSION}.dmg" > "open-mtp-client-${VERSION}.dmg.sha256"
          cat "open-mtp-client-${VERSION}.dmg.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download the `.dmg` below and open it.
          2. Drag **open-mtp-client** onto **Applications**.
          3. Open it. The first time, macOS says it can't check the app for malware,
             because this release is not notarized yet. To open it anyway:
             - **macOS 15 or later:** try to open the app, then go to
               **System Settings > Privacy & Security**, scroll down and click **Open Anyway**.
             - **macOS 14 or earlier:** right-click the app, choose **Open**, then **Open**.

          Then plug in your phone, unlock it and choose **File transfer** in its USB notification.

          The `.sha256` file lets you check the download: `shasum -a 256 -c open-mtp-client-*.dmg.sha256`.

          ## What's changed
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            "dist/open-mtp-client-${VERSION}.dmg" \
            "dist/open-mtp-client-${VERSION}.dmg.sha256" \
            --title "open-mtp-client ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
